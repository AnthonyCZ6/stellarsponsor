[package]
name = "stellar-sponsor"
version = "0.1.0"
edition = "2021"
description = "Contrato Soroban de micro-mecenazgo transparente"
publish = false
rust-version = "1.80"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Igual que release pero conservando los logs de depuración del contrato.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
