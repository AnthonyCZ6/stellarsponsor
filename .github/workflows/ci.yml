name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Ejecutar también la prueba e2e en Stellar Testnet"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contracts:
    name: Contrato (Rust / Soroban)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # Instala el toolchain, targets y componentes declarados en rust-toolchain.toml.
      - name: Instalar toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --locked

      - name: Build Wasm
        run: cargo build --locked --target wasm32-unknown-unknown --release

      - uses: actions/upload-artifact@v4
        with:
          name: stellar_sponsor-wasm
          path: contracts/target/wasm32-unknown-unknown/release/stellar_sponsor.wasm
          if-no-files-found: error

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E en Stellar Testnet
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: [contracts, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: stellar_sponsor-wasm
          path: contracts/target/wasm32-unknown-unknown/release

      - run: npm ci
      - run: npm run test:e2e
